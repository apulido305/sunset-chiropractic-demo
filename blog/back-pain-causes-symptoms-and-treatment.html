  var STORE = 'sunset-demo-key';
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var hex = function (buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); };
  var get = function () { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } };
  var put = function (v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) {} };

  function open(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.data)); })
      .then(function (buf) { render(new TextDecoder().decode(buf)); });
  }
  // Swap in the decrypted page, then run its scripts one at a time in their original order.
  function render(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));
    scripts.forEach(function (s) { s.parentNode.removeChild(s); });
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
    (function next(i) {
      if (i >= scripts.length) return;
      var old = scripts[i], s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        var a = old.attributes[j];
        if (a.name !== 'defer') s.setAttribute(a.name, a.value);
      }
      s.async = false;
      if (old.src) { s.onload = s.onerror = function () { next(i + 1); }; document.head.appendChild(s); }
      else { s.textContent = old.textContent; document.head.appendChild(s); next(i + 1); }
    })(0);
    if (location.hash) { var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }

  function showGate() { document.getElementById('gate').hidden = false; document.getElementById('pw').focus(); }

  var saved = get();
  if (saved && saved.kid === P.kid) open(b64(saved.key)).catch(showGate); else showGate();

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('msg');
    msg.style.color = '#57534E'; msg.textContent = "Opening…";
    var pw = new TextEncoder().encode(document.getElementById('pw').value);

        });

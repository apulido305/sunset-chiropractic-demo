        return crypto.subtle.digest('SHA-256', bits).then(function (h) {
          if (hex(h).slice(0, 12) !== P.kid) throw new Error('bad');
          put({ kid: P.kid, key: btoa(String.fromCharCode.apply(null, new Uint8Array(bits))) });
          return open(bits);
        });
      })
      .catch(function () { msg.style.color = '#9B1C1C'; msg.textContent = "Código incorrecto. Inténtelo de nuevo."; });
  });
})();
